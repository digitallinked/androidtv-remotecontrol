name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole suite (2,000+ app tests, the real-TLS host flows and the
    # Malay sweeps) takes about 6 min on the dev PC; a hosted runner is
    # slower, so 20 min left little room.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      # Writes android/gradlew and local.properties without building, so
      # the `gradle`-tagged dry runs of the signing and AdMob refusals run
      # here instead of skipping. Needs no secrets.
      - run: flutter build apk --config-only --flavor dev -t lib/main_dev.dart
        working-directory: app
      - run: tool/check.sh

  goldens:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden
        working-directory: app
