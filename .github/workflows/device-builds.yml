name: Device builds

# What the Windows dev PC can't check: the iOS app, built without signing so it
# needs no Mac, key or account, and the app on emulators at the oldest and the
# newest Android. Not part of CI because macOS minutes are expensive. Run it
# from the Actions tab, or push a diag/** branch, after changing native code,
# plugins or Flutter.

on:
  workflow_dispatch:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get
      # Flutter gives xcodebuild one minute and then retries over half-unpacked
      # downloads, which fails on a cold machine. Fetch with no limit first.
      - name: Fetch the Swift packages
        run: |
          flutter build ios --config-only --flavor dev -t lib/main_dev.dart --no-codesign || true
          pkill -f unzip || true
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData
          xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme dev
        working-directory: app
      - name: Dev flavor builds
        run: flutter build ios --flavor dev -t lib/main_dev.dart --no-codesign
        working-directory: app
      - name: Prod flavor builds
        run: flutter build ios --flavor prod -t lib/main_prod.dart --no-codesign
        working-directory: app
      - name: The product holds what the App Store needs
        run: bash tool/inspect_ios_product.sh app/build/ios/iphoneos/Runner.app
      - name: The flows run on a simulator
        run: bash tool/ios_simulator_flows.sh

  android:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Android the matrix names, and a current one.
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          # A British language on a US SIM: the default apps must follow the SIM.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -change-locale en-GB
          script: bash tool/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: build/emulator-smoke/
          if-no-files-found: ignore
