# Copy this file to secrets.properties (git-ignored) and fill in the values.
# Without it the prod flavor builds with Google's AdMob test app id, and
# Gradle prints a warning.
#
# The AdMob app id of the Android app, from the AdMob console
# (Apps -> App settings). Never commit the real one.
admobAppIdProd=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
