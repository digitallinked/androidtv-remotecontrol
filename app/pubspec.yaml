name: tv_remote
description: Phone remote for Android TV and Google TV.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  atv_remote:
    path: ../packages/atv_remote
  drift: 2.34.0
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  intl: 0.20.2

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0

flutter:
  generate: true
  uses-material-design: true
