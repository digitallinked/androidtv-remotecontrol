name: tv_remote
description: Phone remote for Android TV and Google TV.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  app_tracking_transparency: 2.0.7
  atv_remote:
    path: ../packages/atv_remote
  clock: 1.1.2
  connectivity_plus: 7.3.2
  device_info_plus: 13.3.0
  drift: 2.34.0
  drift_flutter: 0.3.1
  dynamic_color: 2.1.0
  firebase_analytics: 13.0.1
  firebase_core: 5.1.0
  firebase_crashlytics: 6.0.1
  firebase_remote_config: 7.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  flutter_secure_storage: 11.2.0
  go_router: 18.1.1
  google_mobile_ads: 9.2.0
  in_app_review: 2.0.12
  intl: 0.20.2
  material_ui: 1.2.0
  network_info_plus: 8.2.2
  nsd: 5.0.1
  package_info_plus: 10.2.2
  purchases_flutter: 10.18.1
  riverpod_annotation: 4.0.3
  screen_brightness: 2.1.11
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  wakelock_plus: 1.8.2

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.4
  shared_preferences_platform_interface: 2.4.2
  very_good_analysis: 10.3.0

flutter:
  default-flavor: dev
  generate: true
  uses-material-design: true
  assets:
    - assets/catalogue/
    - assets/licenses/
