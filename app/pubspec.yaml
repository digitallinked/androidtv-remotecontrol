name: tv_remote
description: Phone remote for Android TV and Google TV.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1

resolution: workspace

dependencies:
  atv_remote:
    path: ../packages/atv_remote
  drift: 2.34.0
  drift_flutter: 0.3.1
  dynamic_color: 2.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  flutter_secure_storage: 11.2.0
  go_router: 18.1.1
  intl: 0.20.2
  material_ui: 1.2.0
  riverpod_annotation: 4.0.3
  shared_preferences: 2.5.6

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.4
  shared_preferences_platform_interface: 2.4.2
  very_good_analysis: 10.3.0

flutter:
  generate: true
  uses-material-design: true
